[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifrs9-credit-risk-analytics"
version = "1.0.0"
description = "Interpretable mortgage credit-risk analytics for PD, LGD, EAD, ECL and stress testing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
